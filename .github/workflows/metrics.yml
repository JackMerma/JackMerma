name: Metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------ #
      # Language breakdown (bytes-weighted, recent-activity weighted).
      # Coursework/competitive-programming repos are excluded: their raw
      # byte counts (old C/C++ solutions) would drown out the actual stack.
      # ------------------------------------------------------------------ #
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: JackMerma
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: America/Lima
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_ignored: >-
            competitiveProgramming, assignment1, assignment2, assignment3,
            datalab01, datalab02, Exam2, IDPN_lab5, eda_verano,
            Gestor-de-Datos-BD-, Datos-Personales-BD, pruebas-de-software,
            CalculatorPractice, grafos, CringeCode, chronometer,
            Configuraciones, Lab3-Markdown, fisica, AndroidCanvas,
            competitivo, proyectoAdaGrupoC, Adagrupob
